<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS Robot Battle Game</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #05050b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        /* Top HUD Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-panel {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            display: flex;
            gap: 24px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a99ad;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .hp-container {
            min-width: 180px;
        }

        .hp-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500, #00ff88);
            background-size: 200% 100%;
            transition: width 0.2s ease-out, background-position 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .controls-hint {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 13px;
            color: #ccc;
            line-height: 1.6;
        }

        .controls-hint kbd {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 2px 6px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(0, 240, 255, 0.85);
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
        }

        #crosshair::before {
            top: 11px;
            left: 0;
            width: 24px;
            height: 2px;
        }

        #crosshair::after {
            top: 0;
            left: 11px;
            width: 2px;
            height: 24px;
        }

        .crosshair-dot {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f0ff;
        }

        /* Weapon Display */
        .weapon-card {
            align-self: flex-end;
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 0, 0.4);
            border-radius: 12px;
            padding: 16px 28px;
            text-align: right;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.15);
        }

        .weapon-name {
            font-size: 26px;
            font-weight: 800;
            color: #ffc800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 200, 0, 0.6);
        }

        .weapon-type {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        /* Overlay Screen (Start / Game Over / Clear) */
        .modal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 15, 0.88);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-title {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .modal-title.start {
            color: #00f0ff;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
        }

        .modal-title.gameover {
            color: #ff2a5f;
            text-shadow: 0 0 30px rgba(255, 42, 95, 0.8);
        }

        .modal-title.clear {
            color: #00ff88;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }

        .modal-desc {
            font-size: 16px;
            color: #b0c4de;
            margin-bottom: 24px;
            text-align: center;
            max-width: 500px;
        }

        /* Difficulty Selector UI */
        .difficulty-container {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }

        .diff-btn {
            background: rgba(20, 30, 50, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 130px;
        }

        .diff-btn .diff-sub {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.7;
        }

        .diff-btn:hover {
            border-color: rgba(0, 240, 255, 0.6);
            color: #fff;
            transform: translateY(-2px);
        }

        .diff-btn.selected {
            border-color: #00f0ff;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .diff-btn[data-diff="EASY"].selected {
            border-color: #00ff88;
            color: #00ff88;
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .diff-btn[data-diff="HARD"].selected {
            border-color: #ffaa00;
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.15);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
        }

        .diff-btn[data-diff="EXPERT"].selected {
            border-color: #ff0055;
            color: #ff0055;
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }

        .btn-restart {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none;
            color: #fff;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.8);
        }

        .btn-restart:active {
            transform: scale(0.98);
        }

        /* Damage Flash FX */
        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle, transparent 60%, rgba(255, 0, 50, 0.6) 100%);
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="damage-overlay"></div>

    <div id="hud">
        <div class="top-bar">
            <div class="stats-panel">
                <div class="stat-box hp-container">
                    <span class="stat-label">PLAYER HP</span>
                    <span id="hp-value" class="stat-value">500</span>
                    <div class="hp-bar-bg">
                        <div id="hp-bar" class="hp-bar-fill"></div>
                    </div>
                </div>
                <div class="stat-box">
                    <span class="stat-label">DIFFICULTY</span>
                    <span id="diff-hud-value" class="stat-value" style="color: #ffaa00;">NORMAL</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">REMAINING ENEMIES</span>
                    <span id="enemy-count" class="stat-value">0</span>
                </div>
            </div>

            <div class="controls-hint">
                [<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>] 移動 &nbsp;|&nbsp; 
                [<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd>] 視点回転<br>
                [<kbd>Space</kbd>] ジャンプ &nbsp;|&nbsp; [<kbd>F</kbd>] 攻撃
            </div>
        </div>

        <div id="crosshair">
            <div class="crosshair-dot"></div>
        </div>

        <div class="weapon-card">
            <div class="stat-label">EQUIPPED WEAPON</div>
            <div id="weapon-name" class="weapon-name">ASSAULT RIFLE</div>
            <div id="weapon-desc" class="weapon-type">BALANCED AUTO-FIRE</div>
        </div>
    </div>

    <!-- Start Overlay Screen with Difficulty Selector -->
    <div id="start-screen" class="modal-screen active">
        <h1 class="modal-title start">3D ROBOT FPS</h1>
        <p class="modal-desc">難易度を選択して、ミッションを開始してください。</p>

        <div class="difficulty-container">
            <button class="diff-btn" data-diff="EASY">
                EASY
                <span class="diff-sub">HP:200 / 攻撃:4</span>
            </button>
            <button class="diff-btn selected" data-diff="NORMAL">
                NORMAL
                <span class="diff-sub">HP:300 / 攻撃:8</span>
            </button>
            <button class="diff-btn" data-diff="HARD">
                HARD
                <span class="diff-sub">HP:500 / 攻撃:12</span>
            </button>
            <button class="diff-btn" data-diff="EXPERT">
                EXPERT
                <span class="diff-sub">HP:800 / 攻撃:18</span>
            </button>
        </div>

        <button id="btn-start" class="btn-restart">START MISSION</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="modal-screen">
        <h1 class="modal-title gameover">GAME OVER</h1>
        <p class="modal-desc">敵ロボット軍団の攻撃により撃破されました。</p>
    </div>

    <!-- Game Clear Screen -->
    <div id="game-clear-screen" class="modal-screen">
        <h1 class="modal-title clear">MISSION CLEAR</h1>
        <p class="modal-desc">すべての敵ロボットを駆逐し、エリアの安全を確保しました！</p>
    </div>

    <script>
        // --- DIFFICULTY SETTINGS (Reduced Enemy Damage) ---
        const DIFFICULTY_SETTINGS = {
            EASY: {
                name: "EASY",
                color: "#00ff88",
                enemyHp: 200,
                enemyDamage: 4,
                enemyShootInterval: 1200
            },
            NORMAL: {
                name: "NORMAL",
                color: "#00f0ff",
                enemyHp: 300,
                enemyDamage: 8,
                enemyShootInterval: 800
            },
            HARD: {
                name: "HARD",
                color: "#ffaa00",
                enemyHp: 500,
                enemyDamage: 12,
                enemyShootInterval: 500
            },
            EXPERT: {
                name: "EXPERT",
                color: "#ff0055",
                enemyHp: 800,
                enemyDamage: 18,
                enemyShootInterval: 300
            }
        };

        let selectedDifficultyKey = "NORMAL";

        // --- SYNTHESIZED SOUND SYSTEM ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            this.ctx = new AudioContext();
                        }
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {
                    console.warn("Audio Context init error:", e);
                }
            }

            playShoot(type = 'AR') {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    const bufferSize = this.ctx.sampleRate * 0.08;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const noiseFilter = this.ctx.createBiquadFilter();
                    noiseFilter.type = 'bandpass';

                    if (type === 'AR') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                        noiseFilter.frequency.setValueAtTime(1200, now);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    } else if (type === 'SMG') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(150, now + 0.06);
                        noiseFilter.frequency.setValueAtTime(2000, now);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    } else if (type === 'SHOTGUN') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        noiseFilter.frequency.setValueAtTime(600, now);
                        gain.gain.setValueAtTime(0.6, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    } else {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.09);
                        noiseFilter.frequency.setValueAtTime(1500, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                    }

                    osc.connect(gain);
                    noise.connect(noiseFilter);
                    noiseFilter.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    noise.start(now);
                    osc.stop(now + 0.25);
                    noise.stop(now + 0.25);
                } catch(e) {}
            }

            playHit() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch(e) {}
            }

            playExplosion() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, now);
                    filter.frequency.linearRampToValueAtTime(50, now + 0.4);

                    const gainNode = this.ctx.createGain();
                    gainNode.gain.setValueAtTime(0.7, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                    noise.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(this.ctx.destination);

                    noise.start(now);
                    noise.stop(now + 0.4);
                } catch(e) {}
            }

            playJump() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 0.15);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch(e) {}
            }

            playWeaponSwitch() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.05);
                    osc.frequency.setValueAtTime(783.99, now + 0.1);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch(e) {}
            }

            playGameOver() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.6);

                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.6);
                } catch(e) {}
            }

            playClear() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, index) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();

                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + index * 0.1);

                        gain.gain.setValueAtTime(0.2, now + index * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.3);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(now + index * 0.1);
                        osc.stop(now + index * 0.1 + 0.3);
                    });
                } catch(e) {}
            }
        }

        const sounds = new SoundSystem();

        // --- 1. WEAPON DEFINITIONS ---
        const WEAPONS = {
            AR: {
                name: "ASSAULT RIFLE",
                desc: "標準的なフルオートライフル (バランス重視)",
                cooldown: 180,
                speed: 1.2,
                damage: 25,
                spread: 0.02,
                count: 1,
                color: 0x00f0ff
            },
            SMG: {
                name: "SUBMACHINE GUN",
                desc: "超高速連射 サブマシンガン (近接連射特化)",
                cooldown: 80,
                speed: 1.1,
                damage: 12,
                spread: 0.05,
                count: 1,
                color: 0xffff00
            },
            SHOTGUN: {
                name: "SHOTGUN",
                desc: "散弾拡散 ショットガン (広範囲威圧)",
                cooldown: 650,
                speed: 1.0,
                damage: 18,
                spread: 0.12,
                count: 6,
                color: 0xff5500
            }
        };

        const WEAPON_KEYS = ["AR", "SMG", "SHOTGUN"];

        // --- 2. GAME STATE ---
        let scene, camera, renderer;
        let clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();

        let player = {
            hp: 500,
            maxHp: 500,
            position: new THREE.Vector3(0, 1.6, 25),
            velocity: new THREE.Vector3(),
            rotation: { yaw: 0, pitch: 0 },
            onGround: true,
            currentWeaponKey: "AR",
            lastShotTime: 0
        };

        let keys = {};
        let bullets = [];
        let enemies = [];
        let allies = [];
        let obstacleMeshes = [];
        let particles = [];
        let isGameOver = false;
        let isGameClear = false;

        const STAGE_SIZE = 70;
        const ENEMY_COUNT = 6;
        const ALLY_COUNT = 2;

        // --- 3. INITIALIZATION ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);
            scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            const d = 40;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const cyanLight = new THREE.PointLight(0x00f0ff, 2, 30);
            cyanLight.position.set(0, 10, 0);
            scene.add(cyanLight);

            createEnvironment();

            // Difficulty selection listeners
            const diffButtons = document.querySelectorAll('.diff-btn');
            diffButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    diffButtons.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedDifficultyKey = btn.getAttribute('data-diff');
                });
            });

            // Handle Key Events
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });
            window.addEventListener('resize', onWindowResize);

            // Handle Start Screen Click
            const startBtn = document.getElementById('btn-start');
            const startScreen = document.getElementById('start-screen');

            const startGameHandler = (e) => {
                if (e) e.stopPropagation();
                sounds.init();
                resetGame();
                startScreen.classList.remove('active');
            };

            startBtn.addEventListener('click', startGameHandler);

            animate();
        }

        // --- 4. ENVIRONMENT CREATION ---
        function createEnvironment() {
            const floorGeo = new THREE.PlaneGeometry(STAGE_SIZE, STAGE_SIZE);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x121826,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(STAGE_SIZE, 35, 0x00f0ff, 0x1f293d);
            grid.position.y = 0.01;
            scene.add(grid);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a233a, roughness: 0.5 });
            const wallHeight = 10;

            const wallGeos = [
                { pos: [0, wallHeight/2, -STAGE_SIZE/2], size: [STAGE_SIZE, wallHeight, 1] },
                { pos: [0, wallHeight/2, STAGE_SIZE/2], size: [STAGE_SIZE, wallHeight, 1] },
                { pos: [-STAGE_SIZE/2, wallHeight/2, 0], size: [1, wallHeight, STAGE_SIZE] },
                { pos: [STAGE_SIZE/2, wallHeight/2, 0], size: [1, wallHeight, STAGE_SIZE] }
            ];

            wallGeos.forEach(w => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(...w.size), wallMat);
                wall.position.set(...w.pos);
                wall.receiveShadow = true;
                wall.castShadow = true;
                scene.add(wall);
                obstacleMeshes.push(wall);
            });

            const obsMat = new THREE.MeshStandardMaterial({ color: 0x25334d, roughness: 0.4, metalness: 0.5 });
            const obsPositions = [
                { x: -15, z: -10, w: 4, h: 6, d: 4 },
                { x: 15, z: -15, w: 6, h: 8, d: 6 },
                { x: -10, z: 10, w: 5, h: 5, d: 5 },
                { x: 12, z: 12, w: 4, h: 7, d: 4 },
                { x: 0, z: -5, w: 8, h: 4, d: 3 },
                { x: -20, z: 5, w: 4, h: 6, d: 4 },
                { x: 20, z: -5, w: 5, h: 5, d: 5 }
            ];

            obsPositions.forEach(p => {
                const obs = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, p.d), obsMat);
                obs.position.set(p.x, p.h / 2, p.z);
                obs.castShadow = true;
                obs.receiveShadow = true;
                scene.add(obs);
                obstacleMeshes.push(obs);

                const trimGeo = new THREE.BoxGeometry(p.w + 0.1, 0.2, p.d + 0.1);
                const trimMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                const trim = new THREE.Mesh(trimGeo, trimMat);
                trim.position.set(p.x, p.h - 0.5, p.z);
                scene.add(trim);
            });
        }

        // --- 5. ROBOT MODEL BUILDER ---
        function createRobotMesh(colorHex, isEnemy = true) {
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.7 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff0033 : 0x00ffff });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.8), bodyMat);
            torso.position.y = 1.4;
            torso.castShadow = true;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.7), bodyMat);
            head.position.y = 2.4;
            head.castShadow = true;
            group.add(head);

            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.2), eyeMat);
            visor.position.set(0, 2.45, 0.32);
            group.add(visor);

            const armGeo = new THREE.BoxGeometry(0.35, 1.1, 0.35);
            const leftArm = new THREE.Mesh(armGeo, bodyMat);
            leftArm.position.set(-0.85, 1.3, 0);
            leftArm.castShadow = true;
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, bodyMat);
            rightArm.position.set(0.85, 1.3, 0);
            rightArm.castShadow = true;
            group.add(rightArm);

            const gunGeo = new THREE.BoxGeometry(0.25, 0.25, 0.9);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.85, 1.0, 0.4);
            group.add(gun);

            const legGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
            const leftLeg = new THREE.Mesh(legGeo, darkMat);
            leftLeg.position.set(-0.35, 0.6, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, darkMat);
            rightLeg.position.set(0.35, 0.6, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);

            return group;
        }

        // --- 6. RESET / SPAWN LOGIC ---
        function resetGame() {
            const diffConfig = DIFFICULTY_SETTINGS[selectedDifficultyKey];

            enemies.forEach(e => scene.remove(e.mesh));
            allies.forEach(a => scene.remove(a.mesh));
            bullets.forEach(b => scene.remove(b.mesh));
            particles.forEach(p => scene.remove(p.mesh));

            enemies = [];
            allies = [];
            bullets = [];
            particles = [];

            player.hp = 500;
            player.maxHp = 500;
            player.position.set(0, 1.6, 25);
            player.velocity.set(0, 0, 0);
            player.rotation = { yaw: 0, pitch: 0 };
            player.onGround = true;
            player.currentWeaponKey = "AR";

            isGameOver = false;
            isGameClear = false;

            document.getElementById('game-over-screen').classList.remove('active');
            document.getElementById('game-clear-screen').classList.remove('active');

            const diffHud = document.getElementById('diff-hud-value');
            diffHud.textContent = diffConfig.name;
            diffHud.style.color = diffConfig.color;

            updateHUD();

            for (let i = 0; i < ENEMY_COUNT; i++) {
                const mesh = createRobotMesh(0xff2a4b, true);
                const rx = (Math.random() - 0.5) * 50;
                const rz = -10 - Math.random() * 20;
                mesh.position.set(rx, 0, rz);
                scene.add(mesh);

                enemies.push({
                    mesh: mesh,
                    hp: diffConfig.enemyHp,
                    maxHp: diffConfig.enemyHp,
                    damage: diffConfig.enemyDamage,
                    lastShot: 0,
                    shootInterval: diffConfig.enemyShootInterval + Math.random() * 200,
                    speed: 4.0 + Math.random() * 1.5
                });
            }

            for (let i = 0; i < ALLY_COUNT; i++) {
                const mesh = createRobotMesh(0x0099ff, false);
                const rx = (i === 0) ? -5 : 5;
                mesh.position.set(rx, 0, 20);
                scene.add(mesh);

                allies.push({
                    mesh: mesh,
                    hp: 150,
                    maxHp: 150,
                    lastShot: 0,
                    shootInterval: 900,
                    speed: 4.0
                });
            }
        }

        // --- 7. WEAPON SWITCHING ---
        function switchWeaponRandomly() {
            const available = WEAPON_KEYS.filter(k => k !== player.currentWeaponKey);
            const nextKey = available[Math.floor(Math.random() * available.length)];
            player.currentWeaponKey = nextKey;
            sounds.playWeaponSwitch();
            updateHUD();
        }

        function updateHUD() {
            const hpVal = Math.max(0, Math.ceil(player.hp));
            document.getElementById('hp-value').textContent = hpVal;
            const hpBar = document.getElementById('hp-bar');
            hpBar.style.width = `${(hpVal / player.maxHp) * 100}%`;

            if (hpVal < 150) {
                hpBar.style.backgroundPosition = "0% 0%";
            } else {
                hpBar.style.backgroundPosition = "100% 0%";
            }

            document.getElementById('enemy-count').textContent = enemies.length;

            const w = WEAPONS[player.currentWeaponKey];
            document.getElementById('weapon-name').textContent = w.name;
            document.getElementById('weapon-desc').textContent = w.desc;
        }

        // --- 8. SHOOTING LOGIC ---
        function shootBullet(origin, direction, isPlayer = false, isAlly = false, customWeapon = null, customEnemy = null) {
            const w = customWeapon || WEAPONS[player.currentWeaponKey];
            const bulletCount = (isPlayer && w) ? w.count : 1;
            const damage = isPlayer ? (w ? w.damage : 14) : (customEnemy ? customEnemy.damage : 8);
            const speed = (isPlayer && w) ? w.speed * 40 : 35;
            const color = isPlayer ? (w ? w.color : 0x00f0ff) : (isAlly ? 0x00ffff : 0xff3300);

            if (isPlayer) {
                sounds.playShoot(player.currentWeaponKey);
            } else {
                sounds.playShoot('ENEMY');
            }

            for (let i = 0; i < bulletCount; i++) {
                const geo = new THREE.SphereGeometry(0.18, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);

                mesh.position.copy(origin);

                const dir = direction.clone();

                scene.add(mesh);

                bullets.push({
                    mesh: mesh,
                    velocity: dir.multiplyScalar(speed),
                    isPlayer: isPlayer,
                    isAlly: isAlly,
                    damage: damage,
                    createdAt: clock.getElapsedTime()
                });
            }
        }

        function triggerDamageEffect() {
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = '1';
            setTimeout(() => { overlay.style.opacity = '0'; }, 150);
        }

        function createHitParticles(pos, colorHex) {
            for (let i = 0; i < 8; i++) {
                const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                const pMesh = new THREE.Mesh(pGeo, pMat);
                pMesh.position.copy(pos);
                scene.add(pMesh);

                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 6,
                    Math.random() * 5 + 1,
                    (Math.random() - 0.5) * 6
                );

                particles.push({
                    mesh: pMesh,
                    vel: vel,
                    life: 0.3
                });
            }
        }

        // Check Line of Sight (Obstacle occlusion check)
        function checkLineOfSight(fromPos, toPos) {
            const dir = new THREE.Vector3().subVectors(toPos, fromPos);
            const dist = dir.length();
            dir.normalize();

            raycaster.set(fromPos, dir);
            raycaster.far = dist;

            const intersects = raycaster.intersectObjects(obstacleMeshes, false);
            return intersects.length === 0; // True if clean line of sight
        }

        // --- 9. PLAYER CONTROLS & MOVEMENT (JUMP + OBSTACLE COLLISION) ---
        function updatePlayer(dt) {
            if (isGameOver || isGameClear) return;

            const rotSpeed = 1.8 * dt;

            if (keys['ArrowLeft'] || keys['KeyJ']) player.rotation.yaw += rotSpeed;
            if (keys['ArrowRight'] || keys['KeyL']) player.rotation.yaw -= rotSpeed;
            if (keys['ArrowUp'] || keys['KeyI']) player.rotation.pitch += rotSpeed;
            if (keys['ArrowDown'] || keys['KeyK']) player.rotation.pitch -= rotSpeed;

            player.rotation.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.rotation.pitch));

            const euler = new THREE.Euler(player.rotation.pitch, player.rotation.yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            const moveSpeed = 12.0;
            const moveDir = new THREE.Vector3();

            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;

            moveDir.normalize();
            moveDir.applyEuler(new THREE.Euler(0, player.rotation.yaw, 0));

            player.velocity.x = moveDir.x * moveSpeed;
            player.velocity.z = moveDir.z * moveSpeed;

            // Space Jump Functionality
            if (!player.onGround) {
                player.velocity.y -= 25.0 * dt;
            } else if (keys['Space']) {
                player.velocity.y = 9.5;
                player.onGround = false;
                sounds.playJump();
            }

            // Proposed new position
            const newPos = player.position.clone();
            newPos.x += player.velocity.x * dt;
            newPos.z += player.velocity.z * dt;
            newPos.y += player.velocity.y * dt;

            // Ground Collision
            if (newPos.y <= 1.6) {
                newPos.y = 1.6;
                player.velocity.y = 0;
                player.onGround = true;
            }

            // Player Bounding Box Obstacle Collision
            const playerBox = new THREE.Box3();
            const pRadius = 0.6;
            playerBox.min.set(newPos.x - pRadius, newPos.y - 1.6, newPos.z - pRadius);
            playerBox.max.set(newPos.x + pRadius, newPos.y + 0.4, newPos.z + pRadius);

            let collides = false;
            for (let obs of obstacleMeshes) {
                const obsBox = new THREE.Box3().setFromObject(obs);
                if (playerBox.intersectsBox(obsBox)) {
                    collides = true;
                    break;
                }
            }

            // Apply movement if no collision
            if (!collides) {
                player.position.copy(newPos);
            } else {
                // Try X-only movement
                const xPos = player.position.clone();
                xPos.x = newPos.x;
                xPos.y = newPos.y;
                const xBox = new THREE.Box3();
                xBox.min.set(xPos.x - pRadius, xPos.y - 1.6, xPos.z - pRadius);
                xBox.max.set(xPos.x + pRadius, xPos.y + 0.4, xPos.z + pRadius);

                let xCollides = false;
                for (let obs of obstacleMeshes) {
                    if (xBox.intersectsBox(new THREE.Box3().setFromObject(obs))) {
                        xCollides = true;
                        break;
                    }
                }
                if (!xCollides) {
                    player.position.x = newPos.x;
                }

                // Try Z-only movement
                const zPos = player.position.clone();
                zPos.z = newPos.z;
                zPos.y = newPos.y;
                const zBox = new THREE.Box3();
                zBox.min.set(zPos.x - pRadius, zPos.y - 1.6, zPos.z - pRadius);
                zBox.max.set(zPos.x + pRadius, zPos.y + 0.4, zPos.z + pRadius);

                let zCollides = false;
                for (let obs of obstacleMeshes) {
                    if (zBox.intersectsBox(new THREE.Box3().setFromObject(obs))) {
                        zCollides = true;
                        break;
                    }
                }
                if (!zCollides) {
                    player.position.z = newPos.z;
                }

                player.position.y = newPos.y;
            }

            // Boundary Collisions
            const bound = STAGE_SIZE / 2 - 1.5;
            player.position.x = Math.max(-bound, Math.min(bound, player.position.x));
            player.position.z = Math.max(-bound, Math.min(bound, player.position.z));

            camera.position.copy(player.position);

            if (keys['KeyF']) {
                sounds.init();
                const now = performance.now();
                const weapon = WEAPONS[player.currentWeaponKey];
                if (now - player.lastShotTime >= weapon.cooldown) {
                    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    shootBullet(camera.position.clone().add(dir.clone().multiplyScalar(0.5)), dir, true, false, weapon);
                    player.lastShotTime = now;
                }
            }
        }

        // --- 10. AI & GAME LOOP UPDATES (LINE OF SIGHT REQUIRED) ---
        function updateAI(dt) {
            const now = performance.now();

            enemies.forEach(enemy => {
                let targetPos = player.position;
                let minDist = enemy.mesh.position.distanceTo(player.position);

                allies.forEach(ally => {
                    const d = enemy.mesh.position.distanceTo(ally.mesh.position);
                    if (d < minDist) {
                        minDist = d;
                        targetPos = ally.mesh.position;
                    }
                });

                const dir = new THREE.Vector3().subVectors(targetPos, enemy.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                dir.normalize();

                if (dist > 2.0) {
                    const nextPos = enemy.mesh.position.clone().addScaledVector(dir, enemy.speed * dt);
                    const enemyBox = new THREE.Box3();
                    enemyBox.min.set(nextPos.x - 0.6, nextPos.y, nextPos.z - 0.6);
                    enemyBox.max.set(nextPos.x + 0.6, nextPos.y + 2.8, nextPos.z + 0.6);

                    let collides = false;
                    for (let obs of obstacleMeshes) {
                        const obsBox = new THREE.Box3().setFromObject(obs);
                        if (enemyBox.intersectsBox(obsBox)) {
                            collides = true;
                            break;
                        }
                    }

                    if (!collides) {
                        enemy.mesh.position.copy(nextPos);
                    }
                }

                enemy.mesh.lookAt(targetPos.x, enemy.mesh.position.y, targetPos.z);

                // Check Line of Sight (Only shoot if no obstacle is blocking)
                const shootOrigin = enemy.mesh.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                const targetPoint = targetPos.clone();
                targetPoint.y = (targetPos === player.position) ? 1.6 : 1.4;

                const hasLineOfSight = checkLineOfSight(shootOrigin, targetPoint);

                // Shoot bullet if line of sight is clear
                if (hasLineOfSight && now - enemy.lastShot >= enemy.shootInterval && dist < 45) {
                    const shootDir = new THREE.Vector3().subVectors(targetPoint, shootOrigin).normalize();
                    shootBullet(shootOrigin, shootDir, false, false, null, enemy);
                    enemy.lastShot = now;
                }
            });

            allies.forEach(ally => {
                if (enemies.length === 0) return;

                let closestEnemy = null;
                let minDist = Infinity;

                enemies.forEach(enemy => {
                    const d = ally.mesh.position.distanceTo(enemy.mesh.position);
                    if (d < minDist) {
                        minDist = d;
                        closestEnemy = enemy;
                    }
                });

                if (closestEnemy) {
                    const targetPos = closestEnemy.mesh.position;
                    const dir = new THREE.Vector3().subVectors(targetPos, ally.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();
                    dir.normalize();

                    if (dist > 8) {
                        ally.mesh.position.addScaledVector(dir, ally.speed * dt);
                    }

                    ally.mesh.lookAt(targetPos.x, ally.mesh.position.y, targetPos.z);

                    const shootOrigin = ally.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                    const targetPoint = targetPos.clone().add(new THREE.Vector3(0, 1.2, 0));

                    if (checkLineOfSight(shootOrigin, targetPoint) && now - ally.lastShot >= ally.shootInterval && dist < 25) {
                        const shootDir = new THREE.Vector3().subVectors(targetPoint, shootOrigin).normalize();
                        shootBullet(shootOrigin, shootDir, false, true);
                        ally.lastShot = now;
                    }
                }
            });
        }

        // --- 11. BULLETS & PARTICLES UPDATE ---
        function updateBullets(dt) {
            const now = clock.getElapsedTime();

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                const prevPos = b.mesh.position.clone();
                const stepVec = b.velocity.clone().multiplyScalar(dt);
                b.mesh.position.add(stepVec);

                if (now - b.createdAt > 3.0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                const bPos = b.mesh.position;

                // Raycast sweep to detect obstacle collision along the travel path
                const moveDist = stepVec.length();
                if (moveDist > 0.001) {
                    const travelDir = stepVec.clone().normalize();
                    raycaster.set(prevPos, travelDir);
                    raycaster.far = moveDist + 0.2;

                    const wallHits = raycaster.intersectObjects(obstacleMeshes, false);
                    if (wallHits.length > 0) {
                        createHitParticles(wallHits[0].point, 0x888888);
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                // Collision with Enemies (Player or Ally shot)
                if (b.isPlayer || b.isAlly) {
                    let hitEnemyIndex = -1;
                    for (let j = 0; j < enemies.length; j++) {
                        const enemy = enemies[j];
                        const eHeadPos = enemy.mesh.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                        if (bPos.distanceTo(eHeadPos) < 1.3) {
                            hitEnemyIndex = j;
                            break;
                        }
                    }

                    if (hitEnemyIndex !== -1) {
                        const enemy = enemies[hitEnemyIndex];
                        enemy.hp -= b.damage;
                        sounds.playHit();
                        createHitParticles(bPos, 0xff2a4b);

                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        if (enemy.hp <= 0) {
                            sounds.playExplosion();
                            scene.remove(enemy.mesh);
                            enemies.splice(hitEnemyIndex, 1);

                            if (b.isPlayer) {
                                switchWeaponRandomly();
                            } else {
                                updateHUD();
                            }

                            if (enemies.length === 0 && !isGameClear) {
                                isGameClear = true;
                                sounds.playClear();
                                document.getElementById('game-clear-screen').classList.add('active');
                            }
                        }
                        continue;
                    }
                }

                // Collision with Player
                if (!b.isPlayer && !b.isAlly) {
                    if (bPos.distanceTo(player.position) < 2.0) {
                        player.hp -= b.damage;
                        triggerDamageEffect();
                        sounds.playHit();
                        updateHUD();
                        createHitParticles(bPos, 0xff0055);

                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        if (player.hp <= 0 && !isGameOver) {
                            isGameOver = true;
                            sounds.playGameOver();
                            document.getElementById('game-over-screen').classList.add('active');
                        }
                        continue;
                    }
                }

                // Collision with Allies (Enemy shot)
                if (!b.isPlayer && !b.isAlly) {
                    let hitAllyIndex = -1;
                    for (let j = 0; j < allies.length; j++) {
                        const ally = allies[j];
                        const aHeadPos = ally.mesh.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                        if (bPos.distanceTo(aHeadPos) < 1.3) {
                            hitAllyIndex = j;
                            break;
                        }
                    }

                    if (hitAllyIndex !== -1) {
                        const ally = allies[hitAllyIndex];
                        ally.hp -= b.damage;
                        sounds.playHit();
                        createHitParticles(bPos, 0x0099ff);

                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        if (ally.hp <= 0) {
                            sounds.playExplosion();
                            scene.remove(ally.mesh);
                            allies.splice(hitAllyIndex, 1);
                        }
                        continue;
                    }
                }
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.vel, dt);
                p.life -= dt;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // --- 12. MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            updatePlayer(dt);
            updateAI(dt);
            updateBullets(dt);
            updateParticles(dt);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
